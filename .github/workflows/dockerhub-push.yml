name: 🌥 Docker Push

on:
  workflow_run:
    workflows: ["🎉 Release Binary"]
    types:
      - completed
  workflow_dispatch:

jobs:
  docker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest-16-cores
    strategy:
      matrix:
        include:
          - name: vulnx
            dockerfile: Dockerfile.vulnx
            image: projectdiscovery/vulnx
    steps:
      - name: Git Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Get Github tag
        id: meta
        run: |
          git fetch --tags --force
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            TAG=$(curl --silent "https://api.github.com/repos/projectdiscovery/vulnx/releases/latest" | jq -r .tag_name)
          fi
          MAJOR="v$(echo "${TAG#v}" | cut -d. -f1)"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "MAJOR=${MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64,linux/arm
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ steps.meta.outputs.TAG }}
            ${{ matrix.image }}:${{ steps.meta.outputs.MAJOR }}
          build-args: |
            VERSION=${{ steps.meta.outputs.TAG }}
